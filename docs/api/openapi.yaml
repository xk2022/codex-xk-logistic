    ErrorEnvelope:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 100
          pattern: \S
          enum:
          - VALIDATION_ERROR
          - INVALID_CUSTOMER
          - UNAUTHENTICATED
          - FORBIDDEN
          - CSRF_INVALID
          - ORDER_NOT_FOUND
          - VERSION_CONFLICT
          - ORDER_NOT_EDITABLE
          - PROTECTED_RELATION
          - IDEMPOTENCY_KEY_REUSED
          - IDEMPOTENCY_IN_PROGRESS
          - INTERNAL_ERROR
        message:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: \S
        data:
          anyOf:
          - type: object
            additionalProperties: false
            properties:
              actualVersion:
                type: integer
                minimum: 0
                maximum: 9007199254740991
            required: []
          - type: 'null'
        traceId:
          type: string
          minLength: 1
          maxLength: 200
          pattern: \S
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldIssue'
      required:
      - code
      - message
      - data
      - traceId
      - fieldErrors
